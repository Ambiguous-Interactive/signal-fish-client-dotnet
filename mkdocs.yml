site_name: Signal Fish Client (.NET)
site_description: >-
  C# client SDK for the Signal Fish multiplayer signaling service —
  rooms, lobbies, relay, reconnection, and WebRTC signaling.
site_url: https://Ambiguous-Interactive.github.io/signal-fish-client-dotnet/
repo_url: https://github.com/Ambiguous-Interactive/signal-fish-client-dotnet
repo_name: signal-fish-client-dotnet
edit_uri: edit/main/docs/
copyright: © 2026 Ambiguous Interactive

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
    - header.autohide
  icon:
    repo: fontawesome/brands/github
  font: false

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: Ambiguous-Interactive
      repo: signal-fish-client-dotnet

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ambiguous-Interactive/signal-fish-client-dotnet
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/accessibility.js

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Start Here:
      - Installation & Quick Start: getting-started.md
      - Examples: examples.md
  - Use the SDK:
      - Async Client: client-api.md
      - Polling Client: polling-client.md
      - Events: events.md
      - Errors: errors.md
      - Testing: testing.md
  - Protocol:
      - Protocol Versioning: protocol-versioning.md
      - Delivery & Backpressure: delivery.md
      - Custom Transports: transport.md
  - Unity:
      - Unity Package: unity.md
      - WebGL: webgl.md
      - FishNet Transport: adapters/fishnet.md
  - Project:
      - Server Conformance: conformance.md
      - Performance Baselines: benchmarks.md
      - Releasing: releasing.md
      - Attributions: attributions.md
