# Weekly dependency updates, grouped so one PR bumps a whole group at once.
# Dependabot runs on its own schedule; PR CI time is unaffected.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-dependencies:
        patterns:
          - '*'
    ignore:
      # NUnit 5 is blocked upstream: FsCheck.NUnit 3.4.0 (the latest
      # release) constrains NUnit to >= 4.0.0 && < 5.0.0, so the bump
      # fails restore under warnings-as-errors (NU1608). Remove this
      # ignore when FsCheck ships NUnit 5 support (see the tracking
      # issue).
      - dependency-name: 'NUnit'
        versions: ['>= 5.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-dependencies:
        patterns:
          - '*'
