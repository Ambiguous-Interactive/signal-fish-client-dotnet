name: dotnet

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.config/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.editorconfig'
      - '**.sln'
      - '**.slnx'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.config/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.editorconfig'
      - '**.sln'
      - '**.slnx'
      - '.github/workflows/dotnet.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Never cancel main pushes: a rapid second merge would leave the first
  # SHA without a completed green run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Per-cell SDK scope: the cell installs exactly the SDK its framework
      # needs (the runner muxer may still offer a newer one — this step
      # guarantees the required one is present).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.framework == 'net8.0' && '8.0.x' || '10.0.x' }}

      # Restore dominates the per-cell wall clock; cache the global packages
      # folder (safe: restore is incremental and verifies content hashes).
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # OS-independent lints and formatting run once, on the coverage cell.
      - name: Enforce zero dependencies on the client library
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net8.0'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/lint-zero-dependencies.ps1

      - name: Enforce the LINQ ban on the client library
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net8.0'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/lint-no-linq.ps1

      - name: Check C# formatting (CSharpier)
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net8.0'
        run: |
          dotnet tool restore
          dotnet tool run csharpier -- check .

      # Explicit project restores: bare `dotnet restore` on the slnx needs a
      # newer SDK than some cells install, and a dual-TFM restore needs the
      # net10 SDK — so each cell restores only its own framework. The Tests
      # restore covers the library; the coverage cell also restores the
      # tooling projects.
      - name: Restore
        run: >
          dotnet restore tests/SignalFish.Client.Tests/SignalFish.Client.Tests.csproj
          -p:TargetFramework=${{ matrix.framework }}

      - name: Restore tooling projects
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net8.0'
        run: |
          dotnet restore tests/SignalFish.Client.PerfTests/SignalFish.Client.PerfTests.csproj
          dotnet restore tests/SignalFish.Client.FuzzTests/SignalFish.Client.FuzzTests.csproj

      # Each cell builds only its framework (the netstandard2.1 library
      # rides along via the project reference); the coverage cell also
      # compiles the tooling projects as their PR-time build gate.
      - name: Build test suite
        run: >
          dotnet build tests/SignalFish.Client.Tests/SignalFish.Client.Tests.csproj
          --no-restore -c Release -warnaserror -f ${{ matrix.framework }}

      - name: Build tooling projects
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net8.0'
        run: |
          dotnet build tests/SignalFish.Client.PerfTests/SignalFish.Client.PerfTests.csproj --no-restore -c Release -warnaserror
          dotnet build tests/SignalFish.Client.FuzzTests/SignalFish.Client.FuzzTests.csproj --no-restore -c Release -warnaserror

      # Every cell runs the full suite; coverage is collected (and reported)
      # on one representative Linux cell only — the library is netstandard2.1
      # regardless of runner TFM, so extra instrumentation paid cost for
      # identical data.
      - name: Test (with coverage)
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net8.0'
        run: >
          dotnet test tests/SignalFish.Client.Tests/SignalFish.Client.Tests.csproj
          --no-build -c Release -f ${{ matrix.framework }}
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Test
        if: matrix.os != 'ubuntu-latest' || matrix.framework != 'net8.0'
        run: >
          dotnet test tests/SignalFish.Client.Tests/SignalFish.Client.Tests.csproj
          --no-build -c Release -f ${{ matrix.framework }}
          --logger trx --results-directory TestResults

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net8.0'
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator -reports:TestResults/**/coverage.cobertura.xml -targetdir:coverage-report -reporttypes:HtmlInline_AzurePipelines\;Cobertura

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.framework }}
          path: |
            TestResults/**/*
            coverage-report/**/*
          if-no-files-found: error
