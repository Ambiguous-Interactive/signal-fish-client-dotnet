# Auto-release pipeline for signal-fish-client-dotnet
#
# Tag-driven only (v*): packs the library and the nine Unity UPM
# packages, publishes to GitHub Packages (always) and nuget.org (when
# the NUGET_API_KEY secret is populated), and attaches the
# .nupkg/.snupkg plus the UPM .tgz tarballs to a GitHub Release as a
# no-auth fallback. Never runs on branches or PRs, so PR CI time stays
# flat. Operator runbook: docs/releasing.md.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Pack, publish, release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Mapped at job level because a step's own env is not reliably
      # readable in that step's `if`. Empty when the secret is unset,
      # which is exactly what the nuget.org step tests below.
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # MinVer (M9.1) derives the version from the git tag, which a
          # shallow clone cannot see — the default fetch-depth of 1 would
          # silently stamp the untagged fallback version.
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Validate tag
        shell: bash
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not semver (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # M9.5 release coupling: the UPM fleet releases with the tag. The
      # PR-side lint (lint-unity-package-versions.ps1) keeps the manifests
      # consistent with each other; this re-checks them against the tag
      # itself — an rc tag requires the fleet at the same rc version, and
      # only build metadata (+...) is ignored — so tagging a main whose
      # manifests lag fails here instead of shipping a version mismatch.
      - name: Check Unity package version coupling with the tag
        shell: bash
        run: |
          # Build metadata never participates in version identity.
          RELEASE="${VERSION%%+*}"
          # Capture first: the assignment propagates a find failure to
          # set -e, and the count guard keeps an empty result (tree
          # drift, glob typo) from passing the gate vacuously.
          manifests=$(find unity -type f -name package.json -not -path '*Samples~*')
          count=0
          mismatch=0
          while IFS= read -r manifest; do
            if [ -z "$manifest" ]; then continue; fi
            count=$((count + 1))
            version=$(jq -r .version "$manifest")
            if [ "$version" != "$RELEASE" ]; then
              echo "::error file=$manifest::version $version does not match the release $RELEASE (docs/releasing.md, release checklist: version-couple the UPM fleet)"
              mismatch=1
            fi
          done <<< "$manifests"
          if [ "$count" -eq 0 ]; then
            echo "::error::no unity/**/package.json found - tree drift; check the glob"
            exit 1
          fi
          echo "coupling: $count UPM manifests checked against $RELEASE"
          exit $mismatch

      - name: Restore
        run: dotnet restore src/SignalFish.Client/SignalFish.Client.csproj

      - name: Pack
        run: >
          dotnet pack src/SignalFish.Client/SignalFish.Client.csproj
          --no-restore -c Release
          -p:MinVerVersionOverride=${{ env.VERSION }}
          -p:ContinuousIntegrationBuild=true
          -o dist

      # Issue #106: every v* release ships the UPM fleet too — the core
      # through the sync script's staging (fresh mirror + shipped-asmdef
      # check), each adapter verbatim from its source tree.
      - name: Pack UPM tarballs
        shell: pwsh
        run: pwsh -NoProfile -File scripts/pack-unity-packages.ps1 -OutDir dist

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "dist/*.nupkg"
          --source https://nuget.pkg.github.com/Ambiguous-Interactive/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      # The .snupkg rides only on the GitHub Release: GitHub Packages has
      # no NuGet symbol-publish endpoint, so pushing it there fails.

      # Optional: nuget.org publishing happens only when the NUGET_API_KEY
      # secret is populated (see docs/releasing.md). Two explicit pushes:
      # passing "dist/*.nupkg" "dist/*.snupkg" to one command parses fine
      # but silently skips the .snupkg (verified on SDK 8.0.425) — symbols
      # are published only by pushing the .snupkg explicitly, per
      # https://learn.microsoft.com/en-us/nuget/create-packages/symbol-packages-snupkg
      - name: Publish to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push "dist/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
          dotnet nuget push "dist/*.snupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Create GitHub release with package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          dist/*.nupkg dist/*.snupkg dist/*.tgz
          --verify-tag
          --generate-notes
          --title "SignalFish.Client ${{ env.VERSION }}"
